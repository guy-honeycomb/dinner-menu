<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="התפריט של ארוחת החג">
<title>עריכת התפריט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #E6E9E4;
    --surface: #FBFCFA;
    --ink: #1B211E;
    --muted: #5F6B64;
    --hairline: #C7CFC7;
    --accent: #8C2733;
    --brass: #A9853F;
    --field: #FFFFFF;

    --display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
    --body: "Assistant", "Arial Hebrew", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131715;
      --surface: #1B211E;
      --ink: #E9ECE6;
      --muted: #9AA69D;
      --hairline: #333C36;
      --accent: #DB7B83;
      --brass: #CBA365;
      --field: #232B27;
    }
  }

  :root[data-theme="dark"] {
    --ground: #131715;
    --surface: #1B211E;
    --ink: #E9ECE6;
    --muted: #9AA69D;
    --hairline: #333C36;
    --accent: #DB7B83;
    --brass: #CBA365;
    --field: #232B27;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 32rem;
    margin: 0 auto;
    padding: clamp(1.75rem, 6vw, 3rem) clamp(1.25rem, 5vw, 2.5rem) 4rem;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    align-items: center;
    text-align: center;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--hairline);
  }

  .masthead h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.6rem, 12vw, 3.7rem);
    line-height: 1.15;
    margin: 0;
    color: var(--accent);
  }

  .masthead p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
    letter-spacing: 0.04em;
  }

  /* ---------- menu ---------- */

  .course { display: flex; flex-direction: column; gap: 1.4rem; }

  .course-head { display: flex; align-items: center; gap: 0.9rem; }

  .course-head h2 {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin: 0;
    flex: none;
  }

  .course-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .dishes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.3rem; }

  .dish h3 {
    font-family: var(--display);
    font-size: 1.6rem;
    font-weight: 500;
    line-height: 1.25;
    margin: 0 0 0.1rem;
  }

  .cook { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .signoff {
    border-top: 1px solid var(--hairline);
    padding-top: 1.5rem;
    text-align: center;
    font-family: var(--display);
    font-size: 1.35rem;
    color: var(--accent);
    margin: 0;
  }

  /* ---------- tabs ---------- */

  .tabs {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 1rem;
  }

  .tab {
    font-family: var(--body);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }

  .tab[aria-selected="true"] { color: var(--ink); border-color: var(--brass); }
  .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* ---------- admin ---------- */

  .admin { display: flex; flex-direction: column; gap: 2rem; }

  .admin-intro { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .field-row { display: flex; flex-direction: column; gap: 0.35rem; }

  label { font-size: 0.85rem; font-weight: 700; color: var(--brass); }

  input[type="text"] {
    font-family: var(--body);
    font-size: 1rem;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 0.5rem 0.65rem;
    width: 100%;
  }

  input[type="text"]:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

  .edit-course { display: flex; flex-direction: column; gap: 0.85rem; }

  .edit-course > h3 {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin: 0;
  }

  .edit-dish { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.5rem; align-items: center; }

  .btn {
    font-family: var(--body);
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: 3px;
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    border: 1px solid var(--brass);
    background: none;
    color: var(--ink);
  }

  .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-quiet { border-color: var(--hairline); color: var(--muted); padding: 0.45rem 0.6rem; }

  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; padding-top: 0.5rem; border-top: 1px solid var(--hairline); }

  .note { margin: 0; font-size: 0.9rem; color: var(--muted); }
  .note strong { color: var(--ink); }

  textarea {
    width: 100%;
    min-height: 9rem;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    direction: ltr;
    text-align: left;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 0.6rem;
  }

  .status { min-height: 1.4rem; font-size: 0.9rem; color: var(--accent); font-weight: 700; }

  [hidden] { display: none !important; }

  @media print {
    body { background: #fff; color: #000; }
    .sheet { background: #fff; min-height: 0; max-width: none; }
    .tabs, .admin { display: none !important; }
  }
</style>
</head>
<body>

<div class="sheet">

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" id="tab-menu" role="tab" aria-selected="true" aria-controls="view-menu">התפריט</button>
    <button class="tab" id="tab-admin" role="tab" aria-selected="false" aria-controls="view-admin">עריכה</button>
  </div>

  <div id="view-menu" role="tabpanel" aria-labelledby="tab-menu">
    <header class="masthead">
      <h1 id="m-title">ראש השנה</h1>
      <p id="m-subtitle"></p>
    </header>
    <div id="m-courses"></div>
    <p class="signoff"><a href="./" style="color:inherit">חזרה לתפריט</a></p>
  </div>

  <div id="view-admin" class="admin" role="tabpanel" aria-labelledby="tab-admin" hidden>
    <p class="admin-intro">
      השינויים נשמרים בדפדפן הזה בלבד. כדי שהאורחים יראו אותם, יש לפרסם את הקובץ.
    </p>

    <div class="field-row">
      <label for="f-title">כותרת</label>
      <input type="text" id="f-title">
    </div>

    <div class="field-row">
      <label for="f-subtitle">שורה שנייה</label>
      <input type="text" id="f-subtitle">
    </div>

    <div id="editor"></div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-copy">העתק קובץ</button>
      <button class="btn" id="btn-download">הורד menu.json</button>
      <button class="btn" id="btn-reset">בטל שינויים</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <div class="field-row">
      <label for="out">התוכן לפרסום</label>
      <textarea id="out" readonly></textarea>
      <p class="note">
        לפרסום: פתחו את <strong>menu.json</strong> במאגר ב-GitHub, לחצו על העיפרון,
        הדביקו את התוכן ושמרו. הדף מתעדכן תוך כדקה. הכתובת וה-QR לא משתנים.
      </p>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var DRAFT_KEY = "dinner-menu-draft";
  var data = null;
  var published = null;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") { n.textContent = attrs[k]; }
      else { n.setAttribute(k, attrs[k]); }
    });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- menu rendering ---------- */

  function renderMenu() {
    document.getElementById("m-title").textContent = data.title || "";
    var sub = document.getElementById("m-subtitle");
    sub.textContent = data.subtitle || "";
    sub.hidden = !data.subtitle;

    var host = document.getElementById("m-courses");
    host.textContent = "";

    data.courses.forEach(function (course) {
      if (!course.dishes.length) { return; }

      var head = el("div", { "class": "course-head" }, [el("h2", { text: course.label })]);
      var list = el("ul", { "class": "dishes" });

      course.dishes.forEach(function (dish) {
        var item = el("li", { "class": "dish" }, [el("h3", { text: dish.name })]);
        if (dish.cook) { item.appendChild(el("p", { "class": "cook", text: dish.cook })); }
        list.appendChild(item);
      });

      host.appendChild(el("section", { "class": "course" }, [head, list]));
    });
  }

  /* ---------- editor ---------- */

  function dishRow(course, index) {
    var dish = course.dishes[index];

    var name = el("input", { type: "text", value: dish.name || "", placeholder: "שם המנה" });
    name.addEventListener("input", function () { dish.name = name.value; touch(); });

    var cook = el("input", { type: "text", value: dish.cook || "", placeholder: "מי מביא" });
    cook.addEventListener("input", function () { dish.cook = cook.value; touch(); });

    var del = el("button", { "class": "btn btn-quiet", type: "button", text: "מחק",
                             "aria-label": "מחק מנה" });
    del.addEventListener("click", function () {
      course.dishes.splice(index, 1);
      touch();
      renderEditor();
    });

    return el("div", { "class": "edit-dish" }, [name, cook, del]);
  }

  function renderEditor() {
    var host = document.getElementById("editor");
    host.textContent = "";

    data.courses.forEach(function (course) {
      var block = el("div", { "class": "edit-course" }, [el("h3", { text: course.label })]);

      course.dishes.forEach(function (_, i) { block.appendChild(dishRow(course, i)); });

      var add = el("button", { "class": "btn", type: "button", text: "הוסף מנה" });
      add.addEventListener("click", function () {
        course.dishes.push({ name: "", cook: "" });
        touch();
        renderEditor();
      });

      block.appendChild(add);
      host.appendChild(block);
    });
  }

  function serialise() { return JSON.stringify(data, null, 2); }

  function touch() {
    try { localStorage.setItem(DRAFT_KEY, serialise()); } catch (e) { /* private mode */ }
    document.getElementById("out").value = serialise();
    renderMenu();
  }

  function say(message) {
    var box = document.getElementById("status");
    box.textContent = message;
    setTimeout(function () { box.textContent = ""; }, 4000);
  }

  /* ---------- tabs ---------- */

  function showTab(which) {
    var isAdmin = which === "admin";
    document.getElementById("view-menu").hidden = isAdmin;
    document.getElementById("view-admin").hidden = !isAdmin;
    document.getElementById("tab-menu").setAttribute("aria-selected", String(!isAdmin));
    document.getElementById("tab-admin").setAttribute("aria-selected", String(isAdmin));
    if (isAdmin) { renderEditor(); document.getElementById("out").value = serialise(); }
  }

  document.getElementById("tab-menu").addEventListener("click", function () {
    location.hash = "";
    showTab("menu");
  });

  document.getElementById("tab-admin").addEventListener("click", function () {
    location.hash = "admin";
    showTab("admin");
  });

  /* ---------- actions ---------- */

  document.getElementById("btn-copy").addEventListener("click", function () {
    var text = serialise();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(
        function () { say("הועתק. הדביקו ב-menu.json"); },
        function () { say("ההעתקה נחסמה. סמנו והעתיקו ידנית"); }
      );
    } else {
      say("ההעתקה לא נתמכת. סמנו והעתיקו ידנית");
    }
  });

  document.getElementById("btn-download").addEventListener("click", function () {
    var blob = new Blob([serialise()], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: "menu.json" });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    say("הקובץ הורד");
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    data = clone(published);
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
    renderEditor();
    renderMenu();
    document.getElementById("out").value = serialise();
    say("חזרנו לגרסה שפורסמה");
  });

  /* ---------- boot ---------- */

  function start(loaded) {
    published = loaded;
    data = clone(loaded);

    var draft = null;
    try { draft = localStorage.getItem(DRAFT_KEY); } catch (e) { /* ignore */ }
    if (draft) {
      try {
        var parsed = JSON.parse(draft);
        if (parsed && Array.isArray(parsed.courses)) { data = parsed; }
      } catch (e) { /* corrupt draft, ignore */ }
    }

    document.getElementById("f-title").value = data.title || "";
    document.getElementById("f-subtitle").value = data.subtitle || "";

    document.getElementById("f-title").addEventListener("input", function () {
      data.title = this.value; touch();
    });
    document.getElementById("f-subtitle").addEventListener("input", function () {
      data.subtitle = this.value; touch();
    });

    renderMenu();

    // Guests get the menu and nothing else. The editor is reachable only by
    // asking for it in the URL (#admin), and the tab bar appears with it.
    // This page IS the editor: no fragment to lose, nothing to cache wrong.
    document.getElementById("tabs").hidden = false;
    showTab(location.hash === "#menu" ? "menu" : "admin");
  }

  fetch("menu.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) { throw new Error("HTTP " + r.status); }
      return r.json();
    })
    .then(start)
    .catch(function () {
      document.getElementById("m-courses").appendChild(
        el("p", { "class": "cook", text: "לא הצלחנו לטעון את התפריט. רעננו את הדף." })
      );
    });
})();
</script>

</body>
</html>
