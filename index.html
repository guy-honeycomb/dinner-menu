<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="התפריט של ארוחת הערב">
<title>ארוחת ערב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #E6E9E4;
    --surface: #FBFCFA;
    --ink: #1B211E;
    --muted: #5F6B64;
    --hairline: #C7CFC7;
    --accent: #8C2733;
    --brass: #A9853F;

    --display: "Frank Ruhl Libre", "David Libre", Georgia, serif;
    --body: "Assistant", "Arial Hebrew", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #131715;
      --surface: #1B211E;
      --ink: #E9ECE6;
      --muted: #9AA69D;
      --hairline: #333C36;
      --accent: #DB7B83;
      --brass: #CBA365;
    }
  }

  :root[data-theme="dark"] {
    --ground: #131715;
    --surface: #1B211E;
    --ink: #E9ECE6;
    --muted: #9AA69D;
    --hairline: #333C36;
    --accent: #DB7B83;
    --brass: #CBA365;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 32rem;
    margin: 0 auto;
    padding: clamp(1.75rem, 6vw, 3rem) clamp(1.25rem, 5vw, 2.5rem) 4rem;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 2.75rem;
  }

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
    text-align: center;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--hairline);
  }

  .occasion {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--brass);
    margin: 0;
  }

  .masthead h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.8rem, 13vw, 4rem);
    line-height: 1.15;
    margin: 0;
  }

  .masthead h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .course {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .course-head {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .course-head h2 {
    font-family: var(--body);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin: 0;
    flex: none;
  }

  .course-head::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }

  .dishes {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  .dish h3 {
    font-family: var(--display);
    font-size: 1.65rem;
    font-weight: 500;
    line-height: 1.25;
    margin: 0 0 0.15rem;
  }

  .cook {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .signoff {
    border-top: 1px solid var(--hairline);
    padding-top: 1.75rem;
    text-align: center;
    font-family: var(--display);
    font-size: 1.4rem;
    color: var(--accent);
    margin: 0;
  }

  @media print {
    body { background: #fff; color: #000; }
    .sheet { background: #fff; min-height: 0; max-width: none; }
  }
</style>
</head>
<body>

<div class="sheet">

  <header class="masthead">
    <p class="occasion">הערב</p>
    <h1>ארוחת <em>ערב</em></h1>
  </header>

  <section class="course">
    <div class="course-head">
      <h2>מנות ראשונות</h2>
    </div>
    <ul class="dishes">
      <li class="dish">
        <h3>סלט כרוב</h3>
        <p class="cook">יעל</p>
      </li>
      <li class="dish">
        <h3>סלט ביצים</h3>
        <p class="cook">מאיה</p>
      </li>
    </ul>
  </section>

  <section class="course">
    <div class="course-head">
      <h2>מנות עיקריות</h2>
    </div>
    <ul class="dishes">
      <li class="dish">
        <h3>שוק טלה</h3>
        <p class="cook">שלום</p>
      </li>
      <li class="dish">
        <h3>פיקניה</h3>
        <p class="cook">גיאצו</p>
      </li>
    </ul>
  </section>

  <p class="signoff">בתיאבון</p>

</div>

</body>
</html>
